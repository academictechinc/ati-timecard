<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATI Timecard — Office</title>
<link rel="manifest" href="admin-manifest.json">
<script src="config.js"></script>
<link rel="icon" href="admin-icon-192.png">
<link rel="apple-touch-icon" href="admin-icon-192.png">
<meta name="theme-color" content="#1b1f2a">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{
  --bg:#f5f3ee; --panel:#ffffff; --ink:#1b1f2a; --ink2:#5d6475; --ink3:#8a90a0; --line:#e3ded3; --line2:#efebe3;
  --accent:#e8590c; --accentbg:#fff3eb; --ok:#1f7a45; --okbg:#e3f5ea; --warn:#a85a00; --warnbg:#fff4e0; --bad:#b42318; --badbg:#fde8e7;
  --sub:#3730a3; --subbg:#e8eaff;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  --sans: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.bar{background:var(--ink);color:#fff;display:flex;align-items:center;gap:18px;padding:0 20px;height:56px;position:sticky;top:0;z-index:30}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:14px}
.logo .pc{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.logo small{font-weight:600;letter-spacing:.04em;opacity:.6;text-transform:none;font-size:13px}
nav.tabs{display:flex;gap:2px;height:100%}
nav.tabs button{background:none;border:0;color:#c9cdd6;padding:0 14px;height:100%;font-weight:600;border-bottom:3px solid transparent;position:relative}
nav.tabs button.on{color:#fff;border-bottom-color:var(--accent)}
nav.tabs .badge{background:var(--accent);color:#fff;font-size:11px;border-radius:9px;padding:1px 6px;margin-left:5px}
header .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:#c9cdd6}
.toolbar{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:20;flex-wrap:wrap}
.period{display:flex;align-items:center;gap:6px}
.period .lbl{font-weight:700;font-size:16px;min-width:230px;text-align:center}
.period .lbl small{display:block;font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.okb{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.link{border:0;background:none;color:var(--accent);padding:2px 4px}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:7px 11px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.spacer{flex:1}
main{padding:18px 20px 60px;max-width:1500px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.card .v{font-family:var(--mono);font-size:24px;font-weight:700;margin-top:4px}
.card .v small{font-size:12px;color:var(--ink3);font-family:var(--sans);font-weight:600;margin-left:4px}
.card.warn{border-color:#f1d29b;background:var(--warnbg)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.panel h3{margin:0;padding:12px 14px;font-size:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);padding:9px 10px;border-bottom:1px solid var(--line);background:#fbfaf7;white-space:nowrap;position:sticky;top:0}
.t td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.t td.n,.t th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:#fbf8f2}
.t tr.tot td{font-weight:800;border-top:2px solid var(--ink);background:#fbfaf7}
.t tr.daysep td{background:#f8f6f1;font-weight:700;font-size:12.5px;color:var(--ink2);padding:6px 10px}
.t tr.wksep td{background:var(--ink);color:#fff;font-weight:700;font-size:12.5px}
.t td.muted,.muted{color:var(--ink3)}
.zero{color:#c8c3b8}
.pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:5px;white-space:nowrap}
.pill.Open{background:#f1efe9;color:var(--ink2)} .pill.Submitted{background:var(--subbg);color:var(--sub)} .pill.Approved{background:var(--okbg);color:var(--ok)}
.pill.Pending{background:var(--warnbg);color:var(--warn)} .pill.Active{background:var(--okbg);color:var(--ok)} .pill.Closed{background:#eee;color:#666}
.pill.Job{background:#dfe6f2;color:#23395d} .pill.Travel{background:#f8ebd2;color:#7a4f0f} .pill.Shop{background:#e3e9dd;color:#4a5a40}
.pill.Break{background:#eee;color:#666} .pill.Day{background:#1b1f2a;color:#fff} .pill.PTO{background:#ece2f5;color:#7b4fa0} .pill.Holiday{background:#fde4d6;color:#c2410c}
.flag{display:inline-block;font-size:11.5px;color:var(--warn);background:var(--warnbg);border-radius:5px;padding:1px 6px;margin:1px 3px 1px 0;white-space:nowrap}
.flag.bad{color:var(--bad);background:var(--badbg)}
.ot{color:var(--accent);font-weight:800}
.empsel{display:flex;align-items:center;gap:6px}
.empsel select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;min-width:200px;font-weight:600;background:#fff}
.search{padding:7px 10px;border:1px solid var(--line);border-radius:8px;min-width:240px}
.chk{width:16px;height:16px;accent-color:var(--ink)}
.onote{font-size:12px;color:var(--warn)}
.expand td{background:#fcfbf8}
.inner{width:100%;border-collapse:collapse;font-size:13px}
.inner td{padding:4px 8px;border-bottom:1px dashed var(--line)}

/* customer suggestions */
.sugwrap{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;z-index:60;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:240px;overflow:auto;margin-top:2px}
.sug button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;font-size:13px}
.sug button:hover,.sug button.hi{background:var(--accentbg)}
.sug b{font-family:var(--mono);margin-right:8px}
.custname{display:block;font-size:12px;color:var(--ink3)}
/* company logo */
.atilogo{height:40px;width:auto;display:block;flex:none}
.atidiv{width:1px;height:26px;background:rgba(255,255,255,.22);flex:none}
.atifull{width:200px;height:auto;display:block;margin:0 0 22px}
/* login */
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px;width:380px;box-shadow:0 10px 40px rgba(0,0,0,.06)}
.gate h1{margin:0 0 4px;font-size:22px}
.gate p{margin:0 0 18px;color:var(--ink2)}
.gate label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:12px 0 5px}
.gate input[type=text],.gate input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.err{color:var(--bad);font-weight:600;min-height:20px;margin-top:10px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,18,26,.45);display:grid;place-items:center;z-index:50}
.modal{background:var(--panel);border-radius:12px;width:520px;max-width:94vw;max-height:90vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 14px;font-size:17px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form .full{grid-column:1/-1}
.form label{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.form input,.form select,.form textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}
.form textarea{min-height:60px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal .acts .left{margin-right:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.loading{position:fixed;top:56px;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:50% 100%;animation:ld 1s linear infinite;z-index:40}
@keyframes ld{from{background-position:-50% 0}to{background-position:150% 0}}
.help{color:var(--ink2);font-size:13px;margin:-4px 0 12px}

/* print */
#printArea{display:none}
@media print{
  @page{margin:.5in}
  body{background:#fff;font-size:11px}
  body.printing > *:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  .pr-page{page-break-after:always}
  .pr-page:last-child{page-break-after:auto}
  .pr-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
  .pr-head h1{font-size:18px;margin:0} .pr-head div{text-align:right;font-size:11px}
  table.t th{position:static;background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .t td,.t th{padding:4px 6px}
  .t tr.wksep td{background:#ddd!important;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sig{display:flex;gap:40px;margin-top:30px} .sig div{flex:1;border-top:1px solid #000;padding-top:4px;font-size:10px}
}
</style>
</head>

<script>
const BAKED_API_URL = window.TIMECARD_API_URL || '';   // set in config.js

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const todayISO = () => iso(new Date());
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtS = s => { const d = parse(s); return MON[d.getMonth()]+' '+d.getDate(); };
const fmtL = s => { const d = parse(s); return DOW[d.getDay()]+' '+MON[d.getMonth()]+' '+d.getDate(); };
const fmtUS = s => { const d = parse(s); return (d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear(); };
const h2 = h => (Math.round((+h||0)*100)/100).toFixed(2);
const hz = h => (+h ? h2(h) : '<span class="zero">–</span>');
const to12 = t => { if(!t) return ''; let [h,m] = t.split(':').map(Number); const ap = h>=12?'p':'a'; h = h%12||12; return h+':'+pad(m)+ap; };
const ss = { get(k){ return localStorage.getItem('tto.'+k); }, set(k, v){ localStorage.setItem('tto.'+k, v); }, clear(){ localStorage.removeItem('tto.token'); localStorage.removeItem('tto.pw'); sessionStorage.removeItem('tto.pw'); } };

const S = {
  api: ss.get('api') || BAKED_API_URL, token: ss.get('token'), lastRefresh: 0, lastAct: Date.now(), user: localStorage.getItem('tto.user') || '', me: '', bootstrap: false, users: [],
  settings: { WeekStart:0, OTThreshold:40, TravelPaid:true, PayPeriod:'biweekly', PayPeriodAnchor:'2026-01-04', CompanyName:'' },
  employees: [], jobs: [], entries: [],
  view: 'payroll', mode: 'period', anchor: todayISO(), cFrom: '', cTo: '',
  emp: '', sel: new Set(), jobQ: '', jobFilter: 'Active', expanded: new Set(), loadedRange: '', activity: {}, jobSort: localStorage.getItem('tto.jobSort') || 'job', quietSel: new Set(), qbApprovedOnly: true, qbSkipExported: true, lastExport: null
};

/* ---------- backend ---------- */
let demoLoaded = null;
function loadDemo(){ if (!demoLoaded) demoLoaded = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'demo-backend.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); return demoLoaded; }
async function call(action, payload){
  payload = Object.assign(S.token && !(payload && payload.password) ? { token: S.token } : {}, payload || {});
  let out;
  $('#loading') && $('#loading').classList.remove('hidden');
  try {
    if (S.api === 'demo') { await loadDemo(); out = await window.DemoBackend.call(action, payload); }
    else {
      let r;
      try { r = await fetch(S.api, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({action}, payload)) }); }
      catch (e) { throw new Error('Can\'t reach the server. Check your connection.'); }
      out = await r.json();
    }
  } finally { $('#loading') && $('#loading').classList.add('hidden'); }
  if (out && out.error) { const e = new Error(out.error.replace(/^(AUTH|LOCKED): /, '')); e.auth = /^AUTH:/.test(out.error); throw e; }
  if (out && out.token) { S.token = out.token; ss.set('token', out.token); S.lastRefresh = Date.now(); }
  return out;
}
function toast(m, ms){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), ms || 2500); }
function fail(e){ if (e.auth) { signOutLocal(e.message); return; } toast(e.message, 4500); }
function signOutLocal(msg){ ss.clear(); S.token = null; closeModal(); showLogin(msg); }

/* ---------- login ---------- */
function showLogin(msg){
  $('#vLogin').classList.remove('hidden'); $('#vApp').classList.add('hidden');
  $('#lgErr').textContent = msg || '';
  $('#apiRow').classList.toggle('hidden', !!BAKED_API_URL);
  $('#lgApi').value = S.api || '';
  $('#lgUser').value = S.user || '';
  const demoHint = () => $('#lgDemo').classList.toggle('hidden', (BAKED_API_URL || $('#lgApi').value.trim()) !== 'demo');
  $('#lgApi').oninput = demoHint; demoHint();
  setTimeout(() => (!BAKED_API_URL && !S.api ? $('#lgApi') : S.user ? $('#lgPw') : $('#lgUser')).focus(), 50);
}
$('#lgGo').onclick = login;
$('#lgPw').onkeydown = $('#lgUser').onkeydown = e => { if (e.key === 'Enter') login(); };
async function login(){
  $('#lgErr').textContent = '';
  S.api = BAKED_API_URL || $('#lgApi').value.trim();
  const pw = $('#lgPw').value;
  S.user = $('#lgUser').value.trim();
  S.token = null; ss.clear();
  if (!S.api) { $('#lgErr').textContent = 'Enter the server link'; return; }
  if (!S.user) { $('#lgErr').textContent = 'Enter your name'; return; }
  try {
    const r = await call('adminLogin', { user: S.user, password: pw });
    localStorage.setItem('tto.api', S.api); localStorage.setItem('tto.user', S.user);
    $('#lgPw').value = ''; S.lastAct = Date.now();
    S.settings = r.settings; S.me = r.user; S.bootstrap = r.bootstrap;
    start();
  } catch (e) { $('#lgErr').textContent = e.message; }
}
$('#signOut').onclick = () => signOutLocal();
// idle sign-out: the server also refuses a token that's been idle too long
['mousemove','mousedown','keydown','scroll','touchstart'].forEach(ev => document.addEventListener(ev, () => { S.lastAct = Date.now(); }, { passive: true }));
setInterval(() => {
  if (!S.token || $('#vApp').classList.contains('hidden')) return;
  const idleMs = (S.settings.OfficeIdleMinutes || 30) * 60000;
  if (Date.now() - S.lastAct > idleMs) { signOutLocal('Signed out after ' + (S.settings.OfficeIdleMinutes || 30) + ' minutes of no activity.'); return; }
  // keep the session alive while someone is working, even if they aren't clicking anything that talks to the server
  if (S.lastAct > S.lastRefresh && Date.now() - S.lastRefresh > Math.min(4 * 60000, idleMs / 3)) call('adminPing').catch(fail);
}, 20000);
$('#chgPw').onclick = () => {
  if (S.bootstrap) { toast('Create your own office user on the Employees tab first, then sign in with it.', 5000); S.view = 'emps'; render(); return; }
  modal(`<h3>Change my password</h3><div class="form" style="grid-template-columns:1fr">
    <div><label>New password (8+ characters)</label><input type="password" id="cp1" autocomplete="new-password"></div>
    <div><label>Type it again</label><input type="password" id="cp2" autocomplete="new-password"></div></div><div class="err" id="cpErr"></div>
    <div class="acts"><button class="btn" data-close>Cancel</button><button class="btn pri" id="cpGo">Change password</button></div>`);
  $('#cpGo').onclick = async () => {
    if ($('#cp1').value !== $('#cp2').value) { $('#cpErr').textContent = "Passwords don't match"; return; }
    try { await call('adminChangePassword', { newPassword: $('#cp1').value }); closeModal(); toast('Password changed'); }
    catch (e) { $('#cpErr').textContent = e.message; }
  };
};

/* ---------- ranges ---------- */
function weekStartOf(s){ const ws = S.settings.WeekStart || 0; const back = (parse(s).getDay() - ws + 7) % 7; return addDays(s, -back); }
function periodOf(s){
  if (S.mode === 'week') { const a = weekStartOf(s); return [a, addDays(a, 6)]; }
  if (S.mode === 'custom') return [S.cFrom || weekStartOf(s), S.cTo || addDays(weekStartOf(s), 6)];
  const len = S.settings.PayPeriod === 'weekly' ? 7 : 14;
  const anchor = S.settings.PayPeriodAnchor && /^\d{4}-\d{2}-\d{2}$/.test(S.settings.PayPeriodAnchor) ? S.settings.PayPeriodAnchor : weekStartOf(s);
  const k = Math.floor(daysBetween(anchor, s) / len);
  const a = addDays(anchor, k * len);
  return [a, addDays(a, len - 1)];
}
function range(){ return periodOf(S.anchor); }
function weeksIn(from, to){ const out = []; let w = weekStartOf(from); while (w <= to) { out.push(w); w = addDays(w, 7); } return out; }

/* ---------- load ---------- */
async function start(){
  S.view = 'payroll';
  $('#vLogin').classList.add('hidden'); $('#vApp').classList.remove('hidden');
  $('#coName').textContent = S.settings.CompanyName || '';
  await load();
}
async function load(){
  const [from, to] = range();
  // fetch whole workweeks so overtime is computed on full weeks
  const f = weekStartOf(from), t = addDays(weekStartOf(to), 6);
  try {
    const r = await call('adminLoad', { from: f, to: t });
    S.employees = r.employees; S.jobs = r.jobs; S.entries = r.entries; S.settings = r.settings; S.users = r.users || []; S.activity = r.activity || {}; S.me = r.user; S.bootstrap = r.bootstrap;
    $('#meName').textContent = S.me;
    $('#coName').textContent = S.settings.CompanyName || '';
    S.sel.clear();
  } catch (e) { fail(e); }
  render();
}

/* ---------- calculations ---------- */
const isPaid = e => e.Type === 'Job' || e.Type === 'Shop' || (e.Type === 'Travel' && S.settings.TravelPaid);
const sum = (l, f) => l.reduce((s, e) => s + (f ? (f(e) ? +e.Hours : 0) : +e.Hours), 0);
const empName = id => { const e = S.employees.find(x => x.EmpID === id); return e ? e.Name : id; };
const job = no => S.jobs.find(j => j.JobNo === no);
function inRange(e){ const [f, t] = range(); return e.Date >= f && e.Date <= t; }

/** Per employee summary for the selected range. OT is per FLSA workweek. */
/* ---- day cards: paid work for a day comes from In/Out/Lunch when there is one, otherwise from the job lines ---- */
const asgOf = l => sum(l, e => e.Type === 'Job' || e.Type === 'Shop' || e.Type === 'Travel');
// Each entry carries its own job, times and break; a day's paid time is just its entries added up.
const isWorkE = e => e.Type === 'Job' || e.Type === 'Shop' || e.Type === 'Travel';
function dayInfo(entriesForDay){
  const lines = entriesForDay.filter(e => e.Type !== 'Day');
  const work = lines.filter(isWorkE);
  const asg = asgOf(lines);
  const paid = sum(lines, isPaid);
  const brkMin = work.reduce((t, e) => t + (+e.LunchMin || 0), 0);
  const lunchH = brkMin / 60 + sum(lines, e => e.Type === 'Break');
  const starts = work.map(e => e.Start).filter(Boolean).sort(), ends = work.map(e => e.End).filter(Boolean).sort();
  // unpaid gaps between timed entries (e.g. 12:00–12:45 with nothing logged)
  let gapMin = 0; const timed = work.filter(e => e.Start && e.End).sort((a, b) => a.Start.localeCompare(b.Start));
  for (let i = 1; i < timed.length; i++) { const a = timed[i - 1].End, b = timed[i].Start; if (b > a) gapMin += (+b.slice(0,2)*60 + +b.slice(3)) - (+a.slice(0,2)*60 + +a.slice(3)); }
  return { card: null, lines, asg, paid, bal: null, lunchH, brkMin, gapMin, first: starts[0] || '', last: ends[ends.length - 1] || '' };
}
function byDate(list){ const m = {}; list.forEach(e => { (m[e.Date] = m[e.Date] || []).push(e); }); return m; }
function paidOnDates(dmap, test){ return Object.keys(dmap).filter(test).reduce((s, d) => s + dayInfo(dmap[d]).paid, 0); }
/** Problems that must be fixed before time goes to QuickBooks / payroll. */
function dayProblems(empId, d, info){
  const out = [], dl = DOW[parse(d).getDay()] + ' ' + fmtS(d);
  info.lines.filter(e => (e.Type === 'Job' || e.Type === 'Shop' || e.Type === 'Travel') && e.Start && !e.End).forEach(e => out.push({ t: (e.JobNo || e.Type) + ' has no end time ' + dl, bad: true }));
  if (info.bal !== null && info.bal > 0.009) out.push({ t: h2(info.bal) + ' hrs not on a job ' + dl, bad: true, bal: true });
  if (info.bal !== null && info.bal < -0.009) out.push({ t: 'Jobs over day by ' + h2(-info.bal) + ' ' + dl, bad: true, bal: true });
  return out;
}

function summarize(empId){
  const [from, to] = range();
  const all = S.entries.filter(e => e.EmpID === empId);
  const list = all.filter(inRange);
  const allDays = byDate(all);
  const weeks = weeksIn(from, to).map(ws => {
    const we = addDays(ws, 6);
    const wkIn = all.filter(e => e.Date >= ws && e.Date <= we).filter(inRange);   // part inside range
    const paidAll = paidOnDates(allDays, d => d >= ws && d <= we);              // full week (for OT)
    const otWeek = Math.max(0, paidAll - S.settings.OTThreshold);
    const partial = ws < from || we > to;
    const paidIn = paidOnDates(allDays, d => d >= ws && d <= we && d >= from && d <= to);
    // if the range cuts a week, OT is assigned to the days at the end of the week that fall in range
    let ot = otWeek;
    if (partial && otWeek) { const before = paidOnDates(allDays, d => d >= ws && d < from); const cap = Math.max(0, before + paidIn - S.settings.OTThreshold); ot = Math.min(otWeek, cap, paidIn); }
    const inDays = byDate(wkIn);
    return { ws, we, partial, paid: paidIn, reg: paidIn - ot, ot,
      job: sum(wkIn, e => e.Type === 'Job'), shop: sum(wkIn, e => e.Type === 'Shop'), travel: sum(wkIn, e => e.Type === 'Travel'),
      pto: sum(wkIn, e => e.Type === 'PTO'), hol: sum(wkIn, e => e.Type === 'Holiday'),
      brk: Object.keys(inDays).reduce((s, d) => s + dayInfo(inDays[d]).lunchH, 0) };
  });
  const t = k => weeks.reduce((s, w) => s + w[k], 0);
  const flags = [];
  const days = byDate(list);
  for (let d = from; d <= to && d < todayISO(); d = addDays(d, 1)) {
    const dow = parse(d).getDay();
    if (dow !== 0 && dow !== 6 && !days[d]) flags.push({ t: 'No time ' + DOW[dow] + ' ' + fmtS(d) });
  }
  Object.keys(days).sort().forEach(d => {
    const info = dayInfo(days[d]);
    flags.push(...dayProblems(empId, d, info));
    if (info.paid > 12) flags.push({ t: h2(info.paid) + ' hrs on ' + fmtS(d), bad: true });
    if (info.paid >= 6 && !info.brkMin && info.gapMin < 30 && !info.lines.some(e => e.Type === 'Break')) flags.push({ t: 'No break ' + fmtS(d) });
    if (info.lines.some(e => isWorkE(e) && +e.LunchMin > 0 && +e.LunchMin < 30)) flags.push({ t: 'Unpaid break under 30m ' + fmtS(d) });
  });
  const pendingJobs = [...new Set(list.filter(e => e.JobNo && (!job(e.JobNo) || job(e.JobNo).Status === 'Pending')).map(e => e.JobNo))];
  pendingJobs.forEach(j => flags.push({ t: 'Unconfirmed job ' + j, bad: true }));
  const st = { Open: 0, Submitted: 0, Approved: 0 }; list.forEach(e => st[e.Status] = (st[e.Status] || 0) + 1);
  return { list, weeks, reg: t('reg'), ot: t('ot'), paid: t('paid'), job: t('job'), shop: t('shop'), travel: t('travel'), pto: t('pto'), hol: t('hol'), brk: t('brk'), days: Object.keys(days).length, flags, st };
}
function statusOf(st){
  const n = st.Open + st.Submitted + st.Approved;
  if (!n) return '<span class="muted">No time</span>';
  if (st.Approved === n) return '<span class="pill Approved">Approved</span>';
  if (st.Open === 0) return st.Approved ? '<span class="pill Submitted">Partly approved</span>' : '<span class="pill Submitted">Submitted</span>';
  return `<span class="pill Open">${st.Open} open</span>` + (st.Submitted ? ` <span class="pill Submitted">${st.Submitted} sub</span>` : '');
}

  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));

    banner.innerHTML = 'First-time setup: you signed in with the setup password. Go to <a href="#" id="bootGo">Employees → Office users</a> and create a login for each office person. The setup password stops working after the first one is created.';
    $('#toolbar').before(banner); $('#bootGo').onclick = ev => { ev.preventDefault(); S.view = 'emps'; render(); }; }

}

}

async function setStatus(ids, status, note){
  if (!ids.length) return;
  try {
    const r = await call('adminSetStatus', { ids, status, note });
    const m = {}; r.entries.forEach(e => m[e.EntryID] = e);
    S.entries = S.entries.map(e => m[e.EntryID] || e);
    S.sel.clear(); toast(`${r.updated} entries → ${status}`); render();
  } catch (e) { fail(e); }
}

/* JOB HOURS */
function jobHoursData(){
  const m = {};
  S.entries.filter(inRange).filter(e => e.JobNo && (e.Type === 'Job' || e.Type === 'Travel')).forEach(e => {
    const r = m[e.JobNo] = m[e.JobNo] || { JobNo: e.JobNo, labor: 0, travel: 0, techs: {}, rows: [] };
    if (e.Type === 'Job') r.labor += +e.Hours; else r.travel += +e.Hours;
    const t = r.techs[e.EmpID] = r.techs[e.EmpID] || { labor: 0, travel: 0, days: new Set() };
    if (e.Type === 'Job') t.labor += +e.Hours; else t.travel += +e.Hours;
    t.days.add(e.Date); r.rows.push(e);
  });
  return Object.values(m).sort((a, b) => (b.labor + b.travel) - (a.labor + a.travel));
}

/* JOB LIST */
const dayDiff = d => d ? daysBetween(d, todayISO()) : null;
/** Last date time was posted to a job; falls back to the day it was created. */
function lastActivity(j){ const a = S.activity[j.JobNo]; return a && a.last ? a.last : String(j.CreatedAt || '').slice(0, 10); }
function quietJobs(){
  const n = S.settings.QuietDays || 30;
  return S.jobs.filter(j => (j.Status || 'Active') === 'Active' && j.JobNo !== 'SHOP')
    .map(j => ({ j, last: lastActivity(j), days: dayDiff(lastActivity(j)) }))
    .filter(x => x.days !== null && x.days >= n)
    .sort((a, b) => b.days - a.days);
}
/** Every customer abbreviation with its full name, from all jobs. */
function customerList(){
  const m = {};
  S.jobs.forEach(j => { const a = String(j.Customer || '').trim().toUpperCase(); if (!a) return; if (!m[a] || (!m[a].name && j.CustomerName)) m[a] = { abbr: a, name: j.CustomerName || '' }; });
  return Object.values(m).sort((x, y) => x.abbr.localeCompare(y.abbr));
}
/** Hook an abbreviation input and a name input together: typing either suggests matches by abbreviation OR name. */
function wireCustomer(abbrEl, nameEl, after){
  const list = customerList();
  const attach = (el, other, isAbbr) => {
    const wrap = document.createElement('div'); wrap.className = 'sugwrap'; el.parentNode.insertBefore(wrap, el); wrap.appendChild(el);
    let box = null, hi = -1, items = [];
    const close = () => { if (box) box.remove(); box = null; hi = -1; };
    const pick = c => { abbrEl.value = c.abbr; nameEl.value = c.name; close(); if (after) after(); };
    const show = () => {
      const q = el.value.trim().toLowerCase(); close();
      if (!q) return;
      items = list.filter(c => c.abbr.toLowerCase().includes(q) || c.name.toLowerCase().includes(q)).slice(0, 8);
      if (!items.length || (items.length === 1 && (isAbbr ? items[0].abbr.toLowerCase() : items[0].name.toLowerCase()) === q && (isAbbr ? nameEl.value : abbrEl.value))) return;
      box = document.createElement('div'); box.className = 'sug';
      box.innerHTML = items.map((c, i) => `<button type="button" data-i="${i}"><b>${esc(c.abbr)}</b>${esc(c.name || '(no name yet)')}</button>`).join('');
      box.onmousedown = ev => { const bt = ev.target.closest('button'); if (bt) { ev.preventDefault(); pick(items[+bt.dataset.i]); } };
      wrap.appendChild(box);
    };
    el.addEventListener('input', () => {
      // exact match fills the other box automatically
      const v = el.value.trim().toLowerCase();
      const exact = list.find(c => (isAbbr ? c.abbr : c.name).toLowerCase() === v);
      if (exact && (isAbbr ? exact.name : exact.abbr)) other.value = isAbbr ? exact.name : exact.abbr;
      show(); if (after) after();
    });
    el.addEventListener('keydown', ev => {
      if (!box) return;
      const btns = box.querySelectorAll('button');
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); hi = (hi + (ev.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length; btns.forEach((x, i) => x.classList.toggle('hi', i === hi)); }
      else if (ev.key === 'Enter' && hi >= 0) { ev.preventDefault(); pick(items[hi]); }
      else if (ev.key === 'Escape') { ev.stopPropagation(); close(); }
    });
    el.addEventListener('blur', () => setTimeout(close, 150));
  };
  attach(abbrEl, nameEl, true); attach(nameEl, abbrEl, false);
}

async function saveJob(j, oldNo){

    const r = await call('adminSaveJob', { job: j, oldJobNo: oldNo });

      S.entries.forEach(e => { if (e.JobNo === oldNo) e.JobNo = r.job.JobNo; });
      if (S.activity[oldNo]) { const a = S.activity[oldNo], b = S.activity[r.job.JobNo]; S.activity[r.job.JobNo] = b ? { last: a.last > b.last ? a.last : b.last, hours: a.hours + b.hours } : a; delete S.activity[oldNo]; }
      toast(`Saved — moved ${r.movedEntries} time entries to ${r.job.JobNo}`, 4000);
    } else toast('Saved');
    closeModal(); render();
  } catch (e) { const el = $('#jErr'); if (el) el.textContent = e.message; else fail(e); }
}

/* ---------- QUICKBOOKS DESKTOP ---------- */
const r2 = x => Math.round(x * 100) / 100;
function dur(h){ let m = Math.round(h * 60); return Math.floor(m / 60) + ':' + pad(m % 60); }
const qbDate = s => { const d = parse(s); return (d.getMonth() + 1) + '/' + d.getDate() + '/' + String(d.getFullYear()).slice(2); };
const clean = v => String(v == null ? '' : v).replace(/[\t\r\n"]+/g, ' ').trim();
/** Regular/OT split per entry: hours past the weekly threshold go to the latest entries of that workweek. */
function otAlloc(){
  const groups = {}, m = {};
  S.entries.filter(isPaid).forEach(e => { const k = e.EmpID + '|' + weekStartOf(e.Date); (groups[k] = groups[k] || []).push(e); });
  Object.values(groups).forEach(list => {
    list.sort((a, b) => a.Date.localeCompare(b.Date) || (a.Start || '99:99').localeCompare(b.Start || '99:99') || a.EntryID.localeCompare(b.EntryID));
    let cum = 0; const th = S.settings.OTThreshold;
    list.forEach(e => { const h = +e.Hours; const reg = Math.max(0, Math.min(h, th - cum)); cum += h; m[e.EntryID] = { reg: r2(reg), ot: r2(h - reg) }; });
  });
  return m;
}
function qbLines(opt){
  const q = S.settings, alloc = otAlloc();
  const out = { lines: [], skippedUnapproved: 0, skippedExported: 0, missingJobs: {}, editedAfter: 0 };
  S.entries.filter(inRange).filter(e => e.Type !== 'Break' && e.Type !== 'Day')
    .sort((a, b) => a.Employee.localeCompare(b.Employee) || a.Date.localeCompare(b.Date) || (a.Start || '99').localeCompare(b.Start || '99'))
    .forEach(e => {
      if (opt.approvedOnly && e.Status !== 'Approved') { out.skippedUnapproved++; return; }
      if (/^EDITED/.test(e.QBExported || '')) out.editedAfter++;
      if (opt.skipExported && e.QBExported) { out.skippedExported++; return; }
      const emp = S.employees.find(x => x.EmpID === e.EmpID) || {};
      const j = job(e.JobNo) || {};
      let qbJob = '';
      if (e.Type === 'Job' || (e.Type === 'Travel' && e.JobNo)) { qbJob = j.QBJob || ''; if (!qbJob) out.missingJobs[e.JobNo] = (out.missingJobs[e.JobNo] || 0) + +e.Hours; }
      else if (e.Type === 'Shop') qbJob = q.QBShopJob || '';
      const item = e.Type === 'Job' ? q.QBItemLabor : e.Type === 'Travel' ? q.QBItemTravel : e.Type === 'Shop' ? (q.QBItemShop || '') : '';
      const bill = e.Type === 'Job' || (e.Type === 'Travel' && q.QBTravelBillable && !!e.JobNo);
      const note = [e.Start ? to12(e.Start) + '-' + to12(e.End) : '', e.Notes].filter(Boolean).join(' ');
      const base = { e, emp: emp.PayrollName || emp.Name || e.Employee, job: qbJob, item, bill, note, xfer: true };
      if (e.Type === 'PTO') out.lines.push(Object.assign({}, base, { pitem: q.QBPayPTO, hours: +e.Hours }));
      else if (e.Type === 'Holiday') out.lines.push(Object.assign({}, base, { pitem: q.QBPayHoliday, hours: +e.Hours }));
      else if (!isPaid(e)) out.lines.push(Object.assign({}, base, { pitem: '', hours: +e.Hours, xfer: false }));
      else {
        const a = alloc[e.EntryID] || { reg: +e.Hours, ot: 0 };
        if (a.reg > 0) out.lines.push(Object.assign({}, base, { pitem: q.QBPayRegular, hours: a.reg }));
        if (a.ot > 0) out.lines.push(Object.assign({}, base, { pitem: q.QBPayOT, hours: a.ot, ot: true }));
      }
    });
  return out;
}
function buildIIF(lines){
  const q = S.settings, NL = '\r\n';
  // QuickBooks Desktop 2022+/Enterprise 22+ removed "Import Timer Activities"; Intuit's supported route is
  // File > Utilities > Import > IIF Files with no TIMERHDR/HDR rows above the !TIMEACT header.
  let t = ['!TIMEACT','DATE','JOB','EMP','ITEM','PITEM','DURATION','PROJ','NOTE','XFERTOPAYROLL','BILLINGSTATUS'].join('\t') + NL;
  lines.forEach(l => { t += ['TIMEACT', qbDate(l.e.Date), clean(l.job), clean(l.emp), clean(l.item), clean(l.pitem), dur(l.hours), '', clean(l.note).slice(0, 4000), l.xfer ? 'Y' : 'N', l.bill ? '1' : '0'].join('\t') + NL; });
  return t;
}

    <div class="panel"><h3>Preview <span class="muted" style="font-weight:500">— exactly what goes into QuickBooks${r.lines.length > 300 ? ' (first 300 lines)' : ''}</span></h3>
      <div style="max-height:520px;overflow:auto"><table class="t"><thead><tr><th>Date</th><th>Employee</th><th>Customer:Job</th><th>Service item</th><th>Payroll item</th><th class="n">Duration</th><th>Bill</th><th>Notes</th></tr></thead><tbody>
      ${r.lines.slice(0, 300).map(l => `<tr><td>${qbDate(l.e.Date)}</td><td>${esc(l.emp)}</td><td>${l.job ? esc(l.job) : (l.e.Type === 'Job' || (l.e.Type === 'Travel' && l.e.JobNo) ? '<span class="flag bad">missing</span>' : '<span class="muted">—</span>')}</td><td>${esc(l.item)}</td><td class="${l.ot ? 'ot' : ''}">${esc(l.pitem) || '<span class="muted">not paid</span>'}</td><td class="n">${dur(l.hours)}</td><td>${l.bill ? '✓' : ''}</td><td class="muted">${esc(l.note)}</td></tr>`).join('') || '<tr><td colspan="8" class="muted">Nothing to export for this period.</td></tr>'}
      </tbody></table></div></div>
  </div>
  <div>
    <div class="panel"><h3>QuickBooks settings</h3><div style="padding:14px">
      <p class="help">Names must match your QuickBooks lists <b>exactly</b>, or QuickBooks will create new ones.</p>
      <div class="form" style="grid-template-columns:1fr">
        ${[['QBItemLabor','Service item — job labor'],['QBItemTravel','Service item — travel'],['QBItemShop','Service item — shop (optional)'],['QBShopJob','Customer:Job for shop time (optional)'],
           ['QBPayRegular','Payroll item — regular'],['QBPayOT','Payroll item — overtime'],['QBPayPTO','Payroll item — PTO'],['QBPayHoliday','Payroll item — holiday']]
          .map(([k, l]) => `<div><label>${l}</label><input data-qs="${k}" value="${esc(q[k] == null ? '' : q[k])}"></div>`).join('')}
        <div><label><input type="checkbox" id="qsTB" ${q.QBTravelBillable ? 'checked' : ''}> Travel is billable to the customer</label></div>
      </div>
      <div style="text-align:right;margin-top:12px"><button class="btn pri" id="qsSave">Save settings</button></div>
    </div></div>
    <div class="panel"><h3>How to import</h3><div style="padding:4px 14px 12px;line-height:1.5">
      <p><b>Each payroll</b> (QuickBooks Enterprise 24):</p>
      <ol style="margin:0 0 10px;padding-left:18px">
        <li>Approve the period, then click <b>Download .IIF</b>.</li>
        <li>In QuickBooks, sign in as <b>Admin</b> in <b>single-user mode</b> and make a <b>backup</b>.</li>
        <li><i>File → Utilities → Import → IIF Files</i> → <b>Import IIF</b>, then pick the file.</li>
        <li>Check the hours in <i>Employees → Enter Time → Use Weekly Timesheet</i>, then create paychecks as usual.</li>
      </ol>
      <p class="muted">Each employee needs "Use time data to create paychecks" turned on in QuickBooks. Don't import the same file twice. QuickBooks can't detect duplicates, so this page marks entries as sent and skips them next time.</p>
    </div></div>
  </div></div>`;
  document.querySelectorAll('[data-goemp]').forEach(tr => tr.onclick = () => { S.emp = tr.dataset.goemp; S.view = 'sheets'; render(); });
  $('#qbAp').onchange = e => { S.qbApprovedOnly = e.target.checked; renderQB(); };
  $('#qbSk').onchange = e => { S.qbSkipExported = e.target.checked; renderQB(); };
  $('#qsSave').onclick = async () => {
    const values = {}; document.querySelectorAll('[data-qs]').forEach(i => values[i.dataset.qs] = i.value.trim());
    values.QBTravelBillable = $('#qsTB').checked ? 'TRUE' : 'FALSE';
    try { const res = await call('adminSaveSettings', { values }); S.settings = res.settings; toast('QuickBooks settings saved'); renderQB(); } catch (e) { fail(e); }
  };
  if ($('#qbSaveJobs')) $('#qbSaveJobs').onclick = async () => {
    const inputs = [...document.querySelectorAll('.qbj')].filter(i => i.value.trim());
    if (!inputs.length) return;
    try {
      for (const i of inputs) { const res = await call('adminSaveJob', { job: { JobNo: i.dataset.no, QBJob: i.value.trim() } }); S.jobs = res.jobs; }
      toast('Saved'); renderQB();
    } catch (e) { fail(e); }
  };
  $('#qbGo').onclick = async () => {
    const text = buildIIF(r.lines);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
    a.download = `ATI_Timecard_${from}_to_${to}_QuickBooks.iif`; a.click();
    try {
      const res = await call('adminMarkExported', { ids });
      S.entries.forEach(e => { if (ids.includes(e.EntryID)) e.QBExported = res.stamp; });
      S.lastExport = { ids };
      toast(`Downloaded ${r.lines.length} lines. ${ids.length} entries marked as sent to QuickBooks.`, 5000);
    } catch (e) { fail(e); }
    renderQB();
  };
  if ($('#qbUndo')) $('#qbUndo').onclick = async () => {
    try {
      const ids2 = S.lastExport.ids; await call('adminMarkExported', { ids: ids2, clear: true });
      S.entries.forEach(e => { if (ids2.includes(e.EntryID)) e.QBExported = ''; });
      S.lastExport = null; toast('Unmarked. Those entries will export again.'); renderQB();
    } catch (e) { fail(e); }
  };
}

/* ---------- modal ---------- */
function modal(html){
  $('#modalHost').innerHTML = `<div class="scrim"><div class="modal">${html}</div></div>`;
  const sc = $('#modalHost .scrim');
  sc.onclick = ev => { if (ev.target === sc || ev.target.hasAttribute('data-close')) closeModal(); };
  const first = sc.querySelector('input,select,textarea'); if (first) first.focus();
}
function closeModal(){ $('#modalHost').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---------- export ---------- */
function exportRows(){
  const [from, to] = range();
  const emps = activeEmps();
  const pname = id => { const e = S.employees.find(x => x.EmpID === id); return e ? (e.PayrollName || e.Name) : id; };
  const payroll = [];
  emps.forEach(e => { const s = summarize(e.EmpID); s.weeks.forEach(w => payroll.push({
    'Employee': e.Name, 'Payroll Name': e.PayrollName || e.Name, 'Week Of': fmtUS(w.ws) + (w.partial ? ' (partial)' : ''),
    'Regular Hrs': +h2(w.reg), 'OT Hrs': +h2(w.ot), 'PTO Hrs': +h2(w.pto), 'Holiday Hrs': +h2(w.hol), 'Total Paid Hrs': +h2(w.reg + w.ot + w.pto + w.hol),
    'Job Hrs': +h2(w.job), 'Shop Hrs': +h2(w.shop), 'Travel Hrs': +h2(w.travel), 'Lunch Hrs (unpaid)': +h2(w.brk) })); });
  const totals = emps.map(e => { const s = summarize(e.EmpID); return { 'Employee': e.Name, 'Payroll Name': e.PayrollName || e.Name, 'Regular Hrs': +h2(s.reg), 'OT Hrs': +h2(s.ot), 'PTO Hrs': +h2(s.pto), 'Holiday Hrs': +h2(s.hol), 'Total Paid Hrs': +h2(s.reg + s.ot + s.pto + s.hol), 'Status': s.st.Open ? 'Has open entries' : s.st.Submitted ? 'Awaiting approval' : (s.st.Approved ? 'Approved' : 'No time') }; });
  const list = S.entries.filter(inRange).sort((a, b) => a.Employee.localeCompare(b.Employee) || a.Date.localeCompare(b.Date) || (a.Start || '').localeCompare(b.Start || ''));
  const detail = list.map(e => { const j = job(e.JobNo) || {}; return { 'Date': fmtUS(e.Date), 'Day': DOW[parse(e.Date).getDay()], 'Employee': e.Employee, 'Payroll Name': pname(e.EmpID), 'Type': e.Type, 'Job #': e.JobNo, 'Customer': j.Customer || '', 'Customer Name': j.CustomerName || '', 'Job Description': j.Description || '', 'Start': e.Start, 'End': e.End, 'Lunch/Break (min)': +e.LunchMin || '', 'Hours': +h2(e.Hours), 'Paid': e.Type === 'Day' ? 'Day total' : isPaid(e) || e.Type === 'PTO' || e.Type === 'Holiday' ? 'Y' : 'N', 'Status': e.Status, 'Notes': e.Notes, 'Office Note': e.OfficeNote }; });
  const jobs = [];
  jobHoursData().forEach(r => { const j = job(r.JobNo) || {}; Object.entries(r.techs).forEach(([id, t]) => jobs.push({ 'Job #': r.JobNo, 'Customer': j.Customer || '', 'Customer Name': j.CustomerName || '', 'PO': j.PO || '', 'Quote': j.Quote || '', 'Description': j.Description || '', 'Employee': empName(id), 'Labor Hrs': +h2(t.labor), 'Travel Hrs': +h2(t.travel), 'Total Hrs': +h2(t.labor + t.travel) })); });
  const qb = qbLines({ approvedOnly: false, skipExported: false }).lines.map(l => ({ 'Date': fmtUS(l.e.Date), 'Employee': l.emp, 'Customer:Job': l.job, 'Service Item': l.item, 'Payroll Item': l.pitem, 'Hours': +h2(l.hours), 'Duration': dur(l.hours), 'Billable': l.bill ? 'Y' : 'N', 'Job #': l.e.JobNo, 'Status': l.e.Status, 'In QB': l.e.QBExported ? 'Y' : '', 'Notes': l.note }));
  return { from, to, payroll, totals, detail, jobs, qb };
}
function doExport(){
  const d = exportRows();
  const name = `Timecard_${d.from}_to_${d.to}`;
  if (!window.XLSX) {
    // fallback: CSV of the detail
    const rows = d.detail; const keys = Object.keys(rows[0] || { Date: '' });
    const csv = [keys.join(',')].concat(rows.map(r => keys.map(k => '"' + String(r[k]).replace(/"/g, '""') + '"').join(','))).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = name + '_detail.csv'; a.click();
    toast('Excel library not loaded — downloaded CSV instead', 4000); return;
  }
  const wb = XLSX.utils.book_new();
  const add = (rows, title, widths) => {
    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ '(no data)': '' }]);
    if (widths) ws['!cols'] = widths.map(w => ({ wch: w }));
    if (rows.length) ws['!autofilter'] = { ref: ws['!ref'] };
    XLSX.utils.book_append_sheet(wb, ws, title);
  };
  add(d.totals, 'Payroll Totals', [22, 22, 12, 10, 10, 12, 14, 18]);
  add(d.payroll, 'Payroll by Week', [22, 22, 18, 12, 10, 10, 12, 14, 10, 10, 11, 16]);
  add(d.detail, 'Time Detail', [11, 6, 20, 20, 9, 20, 10, 34, 30, 7, 7, 10, 7, 9, 11, 40, 30]);
  add(d.jobs, 'Job Hours', [20, 10, 34, 10, 10, 30, 20, 10, 10, 10]);
  add(d.qb, 'QuickBooks Lines', [11, 22, 34, 12, 16, 8, 9, 8, 20, 11, 6, 40]);
  wb.Props = { Title: `${S.settings.CompanyName || ''} Timecard ${d.from} to ${d.to}` };
  XLSX.writeFile(wb, name + '.xlsx');
  const open = S.entries.filter(x => inRange(x) && x.Status !== 'Approved').length;
  toast(open ? `Exported. Note: ${open} entries are not approved yet.` : 'Exported', 4000);
}

/* ---------- print ---------- */
function doPrint(){
  const [from, to] = range();
  const head = t => `<div class="pr-head"><h1>${esc(S.settings.CompanyName || '')} — ${t}</h1><div>${fmtL(from)} – ${fmtL(to)}<br>Printed ${new Date().toLocaleString()}</div></div>`;
  let html = '';
  if (S.view === 'sheets' || S.view === 'payroll') {
    const emps = S.view === 'sheets' ? activeEmps().filter(e => e.EmpID === S.emp) : [];
    if (S.view === 'payroll') {
      html += `<div class="pr-page">${head('Payroll Summary')}${$('#view .panel').outerHTML.replace(/<button[\s\S]*?<\/button>/g, '')}</div>`;
      if (!confirm('Also print an individual signed timesheet page for each employee?')) { finishPrint(html); return; }
      emps.push(...activeEmps());
    }
    emps.forEach(e => {
      const s = summarize(e.EmpID);
      if (!s.list.length && S.view === 'payroll') return;
      let rows = '';
      s.weeks.forEach(w => {
        rows += `<tr class="wksep"><td colspan="7">Week of ${fmtS(w.ws)} — Regular ${h2(w.reg)} · OT ${h2(w.ot)} · PTO/Hol ${h2(w.pto + w.hol)}</td></tr>`;
        s.list.filter(x => x.Date >= w.ws && x.Date <= w.we).sort((a, b) => a.Date.localeCompare(b.Date) || (a.Start || '').localeCompare(b.Start || '')).forEach(x => {
          const j = job(x.JobNo) || {};
          rows += `<tr><td>${fmtL(x.Date)}</td><td>${x.Type === 'Day' ? 'In/Out' + (+x.LunchMin ? ' (lunch ' + x.LunchMin + 'm)' : '') : x.Type === 'Break' ? 'Lunch' : x.Type}</td><td class="num">${esc(x.JobNo)}</td><td>${esc(j.Description || '')}</td><td>${x.Start ? to12(x.Start) + '–' + to12(x.End) : ''}</td><td class="n">${h2(x.Hours)}</td><td>${esc(x.Notes)}</td></tr>`;
        });
      });
      html += `<div class="pr-page">${head('Timesheet: ' + esc(e.Name))}
        <table class="t"><thead><tr><th>Date</th><th>Type</th><th>Job #</th><th>Job</th><th>Time</th><th class="n">Hrs</th><th>Notes</th></tr></thead><tbody>${rows}</tbody></table>
        <table class="t" style="width:auto;margin-top:12px"><tr><td>Regular</td><td class="n">${h2(s.reg)}</td><td>Overtime</td><td class="n">${h2(s.ot)}</td><td>PTO</td><td class="n">${h2(s.pto)}</td><td>Holiday</td><td class="n">${h2(s.hol)}</td><td><b>Total paid</b></td><td class="n"><b>${h2(s.reg + s.ot + s.pto + s.hol)}</b></td></tr></table>
        <div class="sig"><div>Employee signature / date</div><div>Supervisor approval / date</div></div></div>`;
    });
  } else {
    const titles = { jobhours: 'Hours by Job', jobs: 'Job List', emps: 'Employees', qb: 'QuickBooks Export Preview' };
    html = `<div class="pr-page">${head(titles[S.view])}${[...document.querySelectorAll('#view .panel')].map(p => p.outerHTML).join('').replace(/<button[\s\S]*?<\/button>/g, '')}</div>`;
  }
  finishPrint(html);
}
function finishPrint(html){
  $('#printArea').innerHTML = html;
  document.body.classList.add('printing');
  setTimeout(() => { window.print(); document.body.classList.remove('printing'); }, 50);
}

/* ---------- wiring ---------- */
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.view = b.dataset.v; S.jobQ = ''; render(); };
$('#rangeMode').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.m === 'custom') { const [f, t] = range(); S.cFrom = f; S.cTo = t; $('#cFrom').value = f; $('#cTo').value = t; }
  S.mode = b.dataset.m; load();
};
$('#cFrom').onchange = $('#cTo').onchange = () => { S.cFrom = $('#cFrom').value; S.cTo = $('#cTo').value; if (S.cFrom && S.cTo && S.cFrom <= S.cTo) load(); };
$('#pPrev').onclick = () => { S.anchor = addDays(range()[0], -1); load(); };
$('#pNext').onclick = () => { S.anchor = addDays(range()[1], 1); load(); };
$('#pToday').onclick = () => { S.anchor = todayISO(); load(); };
$('#refreshBtn').onclick = load;
$('#xlsBtn').onclick = doExport;
$('#printBtn').onclick = doPrint;

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
(async function boot(){
  if (S.api && S.token) { try { const r = await call('adminPing'); start(); return; } catch (e) { ss.clear(); S.token = null; showLogin(e.auth ? e.message : ''); return; } }
  showLogin();
})();
</script>
</body>
</html>
